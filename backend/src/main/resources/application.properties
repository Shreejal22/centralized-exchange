spring.application.name=centralized
# ===============================
# PostgreSQL
# ===============================

spring.datasource.url=jdbc:postgresql://localhost:5432/exchange
spring.datasource.username=exchange
spring.datasource.password=exchange

# Let Flyway manage the schema
spring.jpa.hibernate.ddl-auto=validate

# ===============================
# Redis
# ===============================

spring.data.redis.host=localhost
spring.data.redis.port=6379

# ===============================
# RabbitMQ
# ===============================

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=exchange
spring.rabbitmq.password=exchange

# ===============================
# Server
# ===============================

server.port=8080